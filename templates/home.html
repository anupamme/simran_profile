<div class="container" ng-controller="homeController">
    <div class="row row-grid-3col">
        <div class="col-md-4" ng-repeat="item in items">
            <a class="content-holder" href="#/{{item.detailedLinkID}}" ng-mouseover="hoverIn()" ng-mouseleave="hoverOut()">
                <div class="image-holder index_{{$index % 3}}">
                    <img ng-src="{{item.coverImage}}"/>
<!--                    <span class="text-holder"><span>{{item.title}}</span></span>-->
                </div>
                <span class="wip-badge" ng-if="item.wip">In progress</span>
                <div class="text-holder-homepage" ng-show="hoverEdit">
                    <span>{{item.title}}</span></div>
            </a>
        </div>          
    </div>
</div>
