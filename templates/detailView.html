<div class="container" ng-controller="detailedViewController">
    <div class="row">
        <div class="detailed-content">
            <div class="col-md-6">
                <div>
                    <div class="detailed-header">{{item.detaildHeader}}</div>
                    <br />
                    <div class="detailed-description">
                        <!--                         {{item.description | nl2br}}-->
                        <p ng-bind-html="item.description | nl2br"></p>
                    </div>
                    <br />
                    <div class="detailed-header-detail detailed-description" ng-show="item.awards.length > 0">Awards: </div>
                    <ul class="detailed-description">
                        <li ng-repeat="paper in item.awards">{{paper.title}}</li>
                    </ul>
                    <div class="detailed-header-detail detailed-description" ng-show="item.workExhibited.length > 0">Work exhibited at: </div>
                    <ul class="detailed-description">
                        <li ng-repeat="workExhibited in item.workExhibited">{{workExhibited.title}}
                        </li>
                    </ul>
                    <div class="detailed-header-detail detailed-description" ng-show="item.researchPapers.length > 0">Research Papers: </div>
                    <ul class="detailed-description">
                        <li ng-repeat="paper in item.researchPapers">{{paper.title}}
                        </li>
                    </ul>
                </div>
            </div>
            <div class="col-md-6">
                <div class="detailed-media-list">
                    <div class="detailed-videos-list">
                        <div ng-repeat="video in item.videos">
                            <iframe ng-src="{{video.videoLink | youtubeEmbedUrl }}" width="100%" height="400" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen></iframe>

                            <p><a href="https://vimeo.com/135540900"></a></p>
                            <div class="text-holder">{{video.caption}}</div>
                        </div>
                    </div>

                    <div id="carousel-example-generic" class="carousel slide" data-ride="carousel">
                        <!-- Indicators -->
                        <ol class="carousel-indicators">
                            <li data-target="#carousel-example-generic" data-slide-to="0" class="active"></li>
                            <li data-target="#carousel-example-generic" data-slide-to="1"></li>
                            <li data-target="#carousel-example-generic" data-slide-to="2"></li>
                        </ol>

                        <!-- Wrapper for slides -->
                        <div class="carousel-inner" role="listbox">
                            <div class="item slider-image" ng-repeat="img in item.images" ng-class='{active:$first}' >
                                <img src="{{img.imageLink}}" />
                                <div class="carousel-caption">
                                       {{img.caption }}
                                </div>
                            </div>
                            
                        </div>

                        <!-- Controls -->
                        <a class="left carousel-control" data-target="#carousel-example-generic" role="button" data-slide="prev">
                            <span class="glyphicon glyphicon-chevron-left" aria-hidden="true"></span>
                            <span class="sr-only">Previous</span>
                        </a>
                        <a class="right carousel-control" data-target="#carousel-example-generic" role="button" data-slide="next">
                            <span class="glyphicon glyphicon-chevron-right" aria-hidden="true"></span>
                            <span class="sr-only">Next</span>
                        </a>
                    </div>

                    <br />

                        <div id="slider2" class="carousel slide" data-ride="carousel">
                        <!-- Indicators -->
                        <ol class="carousel-indicators">
                            <li data-target="#carousel-example-generic" data-slide-to="0" class="active"></li>
                            <li data-target="#carousel-example-generic" data-slide-to="1"></li>
                            <li data-target="#carousel-example-generic" data-slide-to="2"></li>
                        </ol>

                        <!-- Wrapper for slides -->
                        <div class="carousel-inner" role="listbox">
                            <div class="item slider-image" ng-repeat="img in item.images_2" ng-class='{active:$first}' >
                                <img src="{{img.imageLink}}"  />
                                <div class="carousel-caption">
                                       {{img.caption }}
                                </div>
                            </div>
                            
                        </div>

                        <!-- Controls -->
                        <a class="left carousel-control" data-target="#slider2" role="button" data-slide="prev">
                            <span class="glyphicon glyphicon-chevron-left" aria-hidden="true"></span>
                            <span class="sr-only">Previous</span>
                        </a>
                        <a class="right carousel-control" data-target="#slider2" role="button" data-slide="next">
                            <span class="glyphicon glyphicon-chevron-right" aria-hidden="true"></span>
                            <span class="sr-only">Next</span>
                        </a>
                    </div>
                    <!--
                        <div class="detailed-image-list">
                            <div id="slider" ng-repeat="image in item.images">
                                <div class="detailed-image-holder">
                                    <img src="{{image.imageLink}}" />
                                </div>
                                <div class="text-holder">{{image.caption}}</div>
                            </div>
                        </div>
-->
                </div>
            </div>
        </div>
    </div>

    <div class="row">

        <div class="col-md-12">
            <div class="backtowork-content-holder">
                <div class="pull-left"><a href="#/">Back to Work</a></div>
                <div class="pull-right"><a href="">prev</a>&nbsp;/&nbsp;<a href="#">next</a></div>
            </div>
        </div>
        <div ng-show="noDataFound">
            <h2>No Data Found</h2>
        </div>
        <div class="col-md-4" ng-repeat="item in list">
            <a class="content-holder" href="#/detailedView/{{item.detailedLinkID}}">
                <div class="image-holder">
                    <img src="{{item.coverImage}}" />
                </div>
                <div class="text-holder">{{item.title}}</div>
            </a>
        </div>

    </div>
</div>

<style>
    .carousel-inner img {
        margin: 0 auto;
    }
</style>
