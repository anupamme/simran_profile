<div class="container_2" ng-controller="detailedViewController">
    <div class="row">
        <div class="detailed-content">
            <div class="col-md-4">
                <div>
                    <div class="detailed-header">{{item.detaildHeader}}</div>
                    <br />
                    <div class="detailed-description">
<!--                         {{item.description | nl2br}}-->
                        <p ng-bind-html="item.description | nl2br"></p>
                    </div>
                    <br />
                    <div class="detailed-header-detail" ng-show="item.awards.length > 0">Awards: </div>
                    <ul>
                        <li ng-repeat="paper in item.awards">{{paper.title}}</li>
                    </ul>
                    <div class="detailed-header-detail" ng-show="item.workExhibited.length > 0">Work exhibited at: </div>
                    <ul>
                        <li ng-repeat="workExhibited in item.workExhibited">
                                {{workExhibited.title}}
                        </li>
                    </ul>
                    <div class="detailed-header-detail" ng-show="item.researchPapers.length > 0">Research Papers: </div>
                    <ul>
                        <li ng-repeat="paper in item.researchPapers">
                            {{paper.title}}
                        </li>
                    </ul>
                </div>
            </div>
            <div class="col-md-1"></div>
            <div class="col-md-6">
                <div class="detailed-media-list">
                    <div class="detailed-videos-list">
                        <div ng-repeat="video in item.videos" >     
                        <iframe ng-src="{{video.videoLink | youtubeEmbedUrl }}" width="100%" height="400" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen></iframe>

                             <p><a href="https://vimeo.com/135540900"></a> </p>
                            <div class="text-holder">{{video.caption}}</div>
                        </div>
                    </div>
                    
                    <div id="myCarousel" class="carousel slide" data-ride="carousel">
                      <!-- Indicators -->
                          <ol class="carousel-indicators">
                                <li data-target="#/detailedView/{{detail_page_id}}/#myCarousel" ng-repeat="img in item.images" class="{active : ({{$index}} === 0)}" data-slide-to="{{$index}}"></li>
                          </ol>
                      <div class="carousel-inner">
                        <div ng-class="{item: true, active : ({{$index}} === 0)}" ng-repeat="img in item.images"> <img ng-src="{{img.imageLink}}" alt="Slide numder {{$index}}">
                          <div class="container">
                            <div class="carousel-caption"> </div>
                          </div>
                        </div>
                      </div>
<!--
                      <a class="left carousel-control" href="#/detailedView/{{detail_page_id}}/#myCarousel" role="button" data-slide="prev"><span class="glyphicon glyphicon-chevron-left"></span></a> 
                      <a class="right carousel-control" href="#/detailedView/{{detail_page_id}}/#myCarousel" role="button" data-slide="next"><span class="glyphicon glyphicon-chevron-right"></span></a> 
-->
                    </div>
                    <br /><br />
                    <div id="myCarousel_2" class="carousel slide" data-ride="carousel">
                      <!-- Indicators -->
                          <ol class="carousel-indicators">
                                <li data-target="#/detailedView/{{detail_page_id}}/#myCarousel_2" ng-repeat="img in item.images_2" class="{active : ({{$index}} === 0)}" data-slide-to="{{$index}}"></li>
                          </ol>
                      <div class="carousel-inner">
                        <div ng-class="{item: true, active : ({{$index}} === 0)}" ng-repeat="img in item.images_2"> <img ng-src="{{img.imageLink}}" alt="Slide numder {{$index}}">
                          <div class="container">
                            <div class="carousel-caption"> </div>
                          </div>
                        </div>
                      </div>
<!--
                      <a class="left carousel-control" href="#/detailedView/{{detail_page_id}}/#myCarousel_2" role="button" data-slide="prev"><span class="glyphicon glyphicon-chevron-left"></span></a> 
                      <a class="right carousel-control" href="#/detailedView/{{detail_page_id}}/#myCarousel_2" role="button" data-slide="next"><span class="glyphicon glyphicon-chevron-right"></span></a> 
-->
                    </div>
                    
                
<!--
                        <div class="detailed-image-list">
                            <div id="slider" ng-repeat="image in item.images">
                                <div class="detailed-image-holder">
                                    <img src="{{image.imageLink}}" />
                                </div>
                                <div class="text-holder">{{image.caption}}</div>
                            </div>
                        </div>
-->
                    </div>
            </div>
        </div>
    </div>

    <div class="row">

        <div class="col-md-12">
            <div class="backtowork-content-holder">
                <div class="pull-left"><a href="#/">Back to Work</a></div>
                <div class="pull-right"><a href="">prev</a>&nbsp;/&nbsp;<a href="#">next</a></div>
            </div>
        </div>
        <div ng-show="noDataFound">
            <h2>No Data Found</h2>
        </div>
        <div class="col-md-4" ng-repeat="item in list">
            <a class="content-holder" href="#/detailedView/{{item.detailedLinkID}}">
                <div class="image-holder">
                    <img src="{{item.coverImage}}" />
                </div>
                <div class="text-holder">{{item.title}}</div>
            </a>
        </div>

    </div>
</div>

<style>
.carousel-inner img { margin: 0 auto; }
</style>
