<div class="container" ng-controller="detailedViewController">
    <div class="row">
        <div class="detailed-content">
            <div class="col-md-3">
                <div>
                    <div class="detailed-header">{{item.detaildHeader}}</div>
                    <br />
                    <div class="detailed-description">
<!--                         {{item.description | nl2br}}-->
                        <p ng-bind-html="item.description | nl2br"></p>
                    </div>
                    <br />
                    <div class="detailed-header-detail" ng-show="item.awards.length > 0">Awards: </div>
                    <ul>
                        <li ng-repeat="paper in item.awards">
                            <a href="#/{{paper.link}}">{{paper.title}}</a>
                        </li>
                    </ul>
                    <div class="detailed-header-detail" ng-show="item.workExhibited.length > 0">Work exhibited at: </div>
                    <ul>
                        <li ng-repeat="workExhibited in item.workExhibited">
                            <a href="#/{{workExhibited.link}}">{{workExhibited.title}}</a>
                        </li>
                    </ul>
                    <div class="detailed-header-detail" ng-show="item.researchPapers.length > 0">Research Papers: </div>
                    <ul>
                        <li ng-repeat="paper in item.researchPapers">
                            <a href="#/{{paper.link}}">{{paper.title}}</a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="col-md-2"></div>
            <div class="col-md-6">
                <div class="detailed-videos-list">
                    <div ng-repeat="video in item.videos" >     
                    <iframe ng-src="{{video.videoLink | youtubeEmbedUrl }}" width="100%" height="400" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen></iframe>
                        
                         <p><a href="https://vimeo.com/135540900">Appetite</a> from <a href="https://vimeo.com/user7682461">simran chopra</a> on <a href="https://vimeo.com">Vimeo</a>.</p>
                        <div class="text-holder">{{video.caption}}</div>
                    </div>
                </div>
                
<!--
                <div class="container slider">
                    <img ng-repeat="slide in item.images" class="slide slide-animation nonDraggableImage"
         ng-swipe-right="nextSlide()" ng-swipe-left="prevSlide()"
         ng-hide="!isCurrentSlideIndex($index)" ng-src="{{slide.imageLink}}">

                    <a class="arrow prev" href="#" ng-click="nextSlide()"></a>

                    <nav class="nav_o">
                        <div class="wrapper">
                            <ul class="dots">
                                <li class="dot" ng-repeat="slide in item.images">
                                    <a href="#/detailedView/{{detail_page_id}}" +  ng-class="{'active':isCurrentSlideIndex($index)}"
                                       ng-click="setCurrentSlideIndex($index);">{{slide.caption}}</a></li>
                            </ul>
                        </div>
                    </nav>
                </div>
-->
                
                
                <div class="detailed-image-list">
                    <div id="slider" ng-repeat="image in item.images">
                        <div class="detailed-image-holder">
                            <img src="{{image.imageLink}}" />
                        </div>
                        <div class="text-holder">{{image.caption}}</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">

        <div class="col-md-12">
            <div class="backtowork-content-holder">
                <div class="pull-left"><a href="#/">Back to Work</a></div>
                <div class="pull-right"><a href="">prev</a>&nbsp;/&nbsp;<a href="#">next</a></div>
            </div>
        </div>
        <div ng-show="noDataFound">
            <h2>No Data Found</h2>
        </div>
        <div class="col-md-4" ng-repeat="item in list">
            <a class="content-holder" href="#/detailedView/{{item.detailedLinkID}}">
                <div class="image-holder">
                    <img src="{{item.coverImage}}" />
                </div>
                <div class="text-holder">{{item.title}}</div>
            </a>
        </div>

    </div>
</div>
