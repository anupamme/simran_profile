<div class="container" ng-controller="graphicsDetailController">
    <div class="row">
        <div class="col-md-4" ng-repeat="item in items">
            <a class="content-holder" href="#/detailedView/{{item.detailedLinkID}}">
                <div class="image-holder index_i_{{$index % 3}}">
                    <img ng-src="{{item.coverImage}}"/></div>
                <div class="text-holder">{{item.title}}</div>
            </a>
        </div>          
    </div>
</div>
